# LightningDatamodule
input_len: 1
output_len: 1
split_config:
  ratios: [3, 1, 0]
  split_method: "half_month"
sampling_rate: 2
batch_size: 2
workers: 8 # mpi proc = 32 num_gpus = 8 max_user_processes = 2048
# LightningModule
surface_alpha: 0.25
optim_config:
  name: AdamW
  args:
    lr: 1e-4
    weight_decay: 5e-6
lr_schedule:
  name: constant_warmup
  args:
    warmup_steps: 1000
# lightning.Trainer
num_gpus: null
strategy: "auto"
fast_dev_run: False
max_epochs: 1000
max_steps: null
min_epochs: 600
min_steps: 6e6 # 500k
limit_train_batches: null
limit_val_batches: null
early_stop_patience: 128
log_image_every_n_steps: 5e4
log_every_n_steps: 50 # default 50
# resume_from_checkpoint: null
finetune_with_checkpoint: "your ckpt path or null"
precision: "32"
save_last: True
